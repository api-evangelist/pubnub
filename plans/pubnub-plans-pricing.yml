specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: PubNub
providerId: pubnub
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
  - Realtime
  - Plans
description: >-
  PubNub bills primarily by Monthly Active Users (MAU). Free supports 200 MAU or 1M
  transactions; Starter is $98/month for 1,000 MAU; Pro starts at custom-priced 5,000 MAU
  ($370/mo) and scales linearly (10K = $550, 25K = $1,130). All features (messages, channels,
  storage within tier) are included; PubNub does not charge separately for peak concurrent
  connections, message volume, or bandwidth.
sources:
  - https://www.pubnub.com/pricing/
plans:
  - id: pubnub-free
    name: Free
    type: freemium
    description: $0/month - 200 MAU or 1M transactions, 1GB storage (7 days).
    entries:
      - label: Monthly subscription
        name: free_monthly
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Monthly Active Users
        name: free_mau
        type: quota
        metric: mau
        limit: 200
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
